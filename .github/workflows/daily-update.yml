name: Daily dashboard update

on:
  schedule:
    - cron: "17 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-dashboard
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate daily snapshot
        env:
          GITHUB_USER: erick-surbakti
          GH_TOKEN: ${{ github.token }}
        run: python scripts/update_dashboard.py

      - name: Commit generated changes
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No dashboard changes."
            exit 0
          fi
          git config user.name "Erick Surbakti"
          git config user.email "erick-surbakti@users.noreply.github.com"
          git add README.md daily/
          git commit -m "chore: refresh daily dashboard"
          git push
