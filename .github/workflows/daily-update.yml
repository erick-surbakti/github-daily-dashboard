name: Publish daily CS lesson

on:
  schedule:
    - cron: "17 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-learning
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate today's lesson
        run: python scripts/update_dashboard.py

      - name: Commit generated lesson
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "Today's lesson already exists."
            exit 0
          fi
          git config user.name "Erick Surbakti"
          git config user.email "erick-surbakti@users.noreply.github.com"
          git add README.md learning/
          git commit -m "learn: publish daily CS topic"
          git push
