name: Publish daily CS lesson

on:
  schedule:
    # 17:17 UTC = 00:17 WIB on the following calendar day
    - cron: "17 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-learning
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Asia/Jakarta

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate today's lesson
        run: python scripts/update_dashboard.py

      - name: Commit generated lesson
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "Today's lesson already exists."
            exit 0
          fi

          git config user.name "Erick Surbakti"
          git config user.email "157338259+erick-surbakti@users.noreply.github.com"
          git add README.md learning/

          LOCAL_COMMIT_TIME="$(date '+%Y-%m-%dT%H:%M:%S%z')"
          GIT_AUTHOR_DATE="$LOCAL_COMMIT_TIME"           GIT_COMMITTER_DATE="$LOCAL_COMMIT_TIME"           git commit -m "learn: publish daily CS topic"

          git push
